<div class="welcome-section">
    <h2>一个随缘更新的博客</h2>
    <p>梦到啥我就往这上面写</p>
    
    <pre id="code-animation" class="random-code"><code id="animation-text">Loading...</code></pre>
    
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        const animationText = document.getElementById('animation-text');
        
        // 检查是否为移动设备
        const isMobile = window.innerWidth <= 768;
        
        // 您指定的字符图案（按行分割）
        const asciiArtLines = [
          '                                                                                           ',
          '                                                                                           ',
          '                                                    EB8BE                                  ',
          '                                                  E4000002B                                ',
          '                                                  C1000000001741028F                       ',
          '                                                  E500000000000000006                      ',
          '                                                 E81000000000000000001D                    ',
          '                                               D30000000000000000000003                    ',
          '                                             E5000000000000000000000001C                   ',
          '                                            D400000000000000000000000004D                  ',
          '                                           F70000000000000000000000000006F                 ',
          '                                           D50000000000000000000000000002B                 ',
          '                                           C000000000000000000000000000007F                ',
          '                                           E700000000000000000000000000004D                ',
          '                                            B30000000000000000000000000001C                ',
          '                                              E760000000000000000000000000B                ',
          '                                                D1000000000000000000000000A                ',
          '                                                72000000000000000000000000A                ',
          '                                                 E6000000000000000000000009                ',
          '                                                   910005000000000000000008                ',
          '                                                   90002E500000000000000008F               ',
          '                                                   C30001000000000000000008                ',
          '                            ED                     E60000000000000000041206E               ',
          '                           E800005F                 910000000000000000D8786E               ',
          '                        D3000000003                 700000000000000000EFECE                ',
          '                        80000000000D            D6761000000000000000019                    ',
          '                        70000000000B            50000000000000000000093B                   ',
          '                        B20000000000479CF      F4000000000000000000006                     ',
          '                         A100000000000000047BEA10000000000000000000001                     ',
          '                          E8200000000000000000000000000000000000000000A                    ',
          '                              ED400000000000000000000000000000000000005                    ',
          '                               C200000000000000000000000000000000000001E  C8A              ',
          '                               B10000000000000000000000000000000000000010004F              ',
          '                               B10000000000000000000000000000000000000008                  ',
          '                               A10000000000000000000000000000000000000018                  ',
          '                              E500000000000000000000000000000000000000002B                 ',
          '                              C3000000000000000000000000000000000000000003D                '
        ];
        
        // 网站介绍文本（用于逐行显示）
        const introLines = [
          'console.log("Hello, World!");',
          '// 欢迎来到我的博客',
          'const blog = {',
          '  title: "御坂10056号的博客",',
          '  description: "梦到啥我就往这上面写"',
          '};'
        ];
        
        if (isMobile) {
          // 移动设备：直接显示介绍信息
          animationText.textContent = ''; // 清空当前内容
          let introCurrentLine = 0;
          
          const typeWriter = setInterval(() => {
            if (introCurrentLine < introLines.length) {
              animationText.textContent += introLines[introCurrentLine] + '\n';
              introCurrentLine++;
            } else {
              clearInterval(typeWriter);
            }
          }, 150); // 移动设备上更快的打字速度
        } else {
          // 电脑端：逐行显示ASCII艺术
          animationText.textContent = ''; // 清空当前内容
          let currentLine = 0;
          
          const asciiPrinter = setInterval(() => {
            if (currentLine < asciiArtLines.length) {
              animationText.textContent += asciiArtLines[currentLine] + '\n';
              currentLine++;
            } else {
              clearInterval(asciiPrinter);
              
              // 显示完整字符画1秒后切换到介绍信息
              setTimeout(() => {
                animationText.textContent = ''; // 清空当前内容
                let introCurrentLine = 0;
                
                const typeWriter = setInterval(() => {
                  if (introCurrentLine < introLines.length) {
                    animationText.textContent += introLines[introCurrentLine] + '\n';
                    introCurrentLine++;
                  } else {
                    clearInterval(typeWriter);
                  }
                }, 300); // 每300毫秒显示一行
              }, 1000); // 完整显示字符画后等待1秒
            }
          }, 50); // 每50毫秒显示一行
        }
      });
    </script>
    
    <nav class="navigation">

        <a href="/bloglist/podcast-download.html" class="nav-link">🎧 播客下载</a>
    </nav>
</div>
